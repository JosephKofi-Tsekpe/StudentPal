<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studentpal | A little progress, every day</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#20263f;font:15px system-ui}aside{position:fixed;inset:0 auto 0 0;width:230px;background:#fff;padding:30px 20px;border-right:1px solid #e8eaf1}h1{font-size:32px;letter-spacing:-1px}h2{font-size:21px}h3{font-size:16px}.logo{font-size:25px;font-weight:800;color:#5148bf;margin-bottom:40px}.logo small{display:block;font-size:11px;letter-spacing:2px;color:#8b89a6;margin-top:8px}nav button{display:block;width:100%;text-align:left;background:transparent;color:#70758b;margin:6px 0;padding:13px 16px}nav button.active{color:#5148bf;background:#efedfc}button{border:0;border-radius:10px;padding:12px 18px;background:#5a50c8;color:white;font:inherit;cursor:pointer}button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:wait}.secondary{background:#edf0f7;color:#444b66}main{margin-left:230px;padding:35px 5%;max-width:1450px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.muted{color:#7a8198;font-size:13px}.pill{background:#e9f5ee;color:#397655;padding:8px 12px;border-radius:20px;font-size:12px}.hero{background:#eae8fb;border-radius:20px;padding:30px;display:flex;justify-content:space-between;align-items:center;margin:25px 0}.hero h2{font-size:26px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.card{background:white;border:1px solid #e8eaf0;border-radius:16px;padding:24px;margin-bottom:18px}.course{border-top:4px solid #8b80df}.big{font-size:32px;font-weight:750;margin:12px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:block;font-size:13px;color:#60677d;margin:15px 0 7px}input,select,textarea{font:inherit;padding:12px;border:1px solid #dce0ec;border-radius:9px;background:white;width:100%;color:#20263f}select{max-width:350px}textarea{min-height:100px}#notice{display:none;padding:15px;background:#fff1df;border-radius:10px;margin-bottom:20px;white-space:pre-wrap}pre{white-space:pre-wrap;font:15px/1.8 system-ui}.empty{text-align:center;padding:45px;color:#737a91}.drop{border:2px dashed #d6d0f0;padding:30px;border-radius:14px;background:#faf9ff}progress{width:100%;accent-color:#695dd1}a{color:#5a50c8}.q{padding:20px 0;border-bottom:1px solid #eee}.q label{padding:12px;background:#f6f7fb;border-radius:10px}.q input[type=radio]{width:auto;margin-right:10px}.timer{position:sticky;top:10px;padding:12px;background:#292640;color:white;border-radius:10px;z-index:2}@media(max-width:750px){aside{position:static;width:auto;padding:18px}.logo{margin-bottom:15px}nav{display:flex;overflow:auto}nav button{min-width:max-content}main{margin:0;padding:20px}.hero{padding:22px}h1{font-size:26px}}
</style><aside><div class="logo">◈ Studentpal<small>MAKE ROOM TO LEARN</small></div><nav id="nav"></nav><p class="muted">Your materials.<br>Your pace. Your progress.</p></aside><main><header><span class="muted">YOUR PERSONAL STUDY SPACE</span><span id="connection" class="pill">Checking connection</span></header><div id="notice" role="alert"></div><div id="view"></div></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let courses=[],selected='',tab='Dashboard',quiz=null,clock=null;
const tabs=['Dashboard','My Courses','Study Calendar','Learning','Quick Quiz','Main Quiz','Stats','Learn More'];
function notice(s){$('#notice').textContent=s;$('#notice').style.display=s?'block':'none'}
async function api(path,data){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function run(fn){notice('');try{await fn()}catch(e){notice(e.message)}}
async function refresh(render=true){const r=await fetch('/api/courses');const j=await r.json();courses=j.courses;if(!selected&&courses.length)selected=courses[0].id;$('#connection').textContent=j.connected?'OpenAI key configured':'OpenAI key needed';if(render)draw()}
function course(){return courses.find(c=>c.id===selected)}
function picker(){return '<label>Course</label><select id="pick" onchange="selected=this.value;draw()"><option value="">Select a course</option>'+courses.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')+'</select>'}
function go(t){tab=t;notice('');draw()}
function draw(){ $('#nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let c=course(),h=`<h1>${tab}</h1>`;
if(tab==='Dashboard'){let sessions=courses.flatMap(c=>c.plan);h='<h1>A little progress, every day.</h1><p class="muted">Turn your course materials into something you understand.</p><div class="hero"><div><h2>Your next chapter starts here.</h2><p>Bring a PDF. Choose your dates. Learn at your own pace.</p></div><button onclick="go(\'My Courses\')">+ Add a course</button></div><div class="grid">'+[['Active courses',courses.length],['Study sessions',sessions.length],['Completed',sessions.filter(s=>s.done).length]].map(([n,v])=>`<div class="card"><span class="muted">${n}</span><div class="big">${v}</div></div>`).join('')+'</div><h2>Your bookshelf</h2>'+cards()}
if(tab==='My Courses')h+='<p class="muted">PDF reading powered by OpenAI. Documents stay saved if analysis fails.</p><div class="card"><label>Course name</label><input id="name" placeholder="e.g. Introduction to Microeconomics"><label>Course material</label><div class="drop"><input id="file" type="file" accept="application/pdf"><p class="muted">PDF up to 20 MB. For slides or pictures, export to PDF first in this version.</p></div><br><button onclick="upload(this)">Create course & save PDF</button></div>'+cards();
if(tab==='Study Calendar'){h+=picker();if(c)h+=`<div class="card"><h2>Make a plan that fits your week</h2><label>Topic or chapters to study</label><input id="scope" placeholder="e.g. Chapters 1 to 3"><label>Choose a date, then add it. Nonconsecutive dates are welcome.</label><div class="row"><input type="date" id="date" style="max-width:240px"><button class="secondary" onclick="addDate()">Add date</button></div><textarea id="dates" placeholder="Selected dates, one per line"></textarea><br><br><button onclick="savePlan()">Save study dates</button></div>`+c.plan.map((s,i)=>`<div class="card row"><strong>${esc(s.date)}</strong><span>${esc(s.topic)}</span><button class="secondary" onclick="complete(${i})">${s.done?'✓ Completed':'Mark complete'}</button><button onclick="go('Learning')">Learn</button></div>`).join('')}
if(tab==='Learning'){h+=picker();if(c)h+=`<div class="card"><h2>What would you like to understand?</h2><label>Topic or question</label><input id="topic" placeholder="Explain a concept, diagram, or chapter"><br><br><button onclick="lesson(this)">Teach me this</button><p class="muted">Answers use your extracted material and include source page references.</p></div><div class="card" id="lesson"><p class="muted">Your lesson will appear here.</p></div>`}
if(tab.includes('Quiz')){h+=picker();if(c)h+=`<div class="card"><h2>${tab==='Quick Quiz'?'A small check. A stronger understanding.':'Put your understanding to the test.'}</h2><label>${tab==='Quick Quiz'?'Subtopic':'Topic or chapters'}</label><input id="topic"><div class="grid"><div><label>Question type</label><select id="format"><option>MCQ</option><option>Theory</option><option>Both</option></select></div><div><label>Questions</label><input id="count" type="number" min="${tab==='Quick Quiz'?5:15}" max="${tab==='Quick Quiz'?15:100}" value="${tab==='Quick Quiz'?5:15}"></div><div><label>Minutes</label><input id="minutes" type="number" min="1" max="300" value="${tab==='Quick Quiz'?10:30}"></div></div><br><button onclick="startQuiz(this)">Generate quiz</button><p class="muted">Theory answers use model-answer self-review in this first version.</p></div><div id="quiz"></div>`}
if(tab==='Stats'){h+=picker();if(c)h+=c.attempts.length?c.attempts.map(a=>`<div class="card"><span class="muted">${a.date}</span><h2>${a.score} / ${a.mcqs} MCQs correct</h2><p>${a.results.length} total questions. Theory responses saved for self-review.</p></div>`).join(''):'<div class="card empty">Your first quiz will start your performance history.</div>'}
if(tab==='Learn More')h+='<div class="card"><h2>Follow your curiosity</h2><label>Topic</label><input id="search" placeholder="What would you like to explore?"><br><button onclick="resources()">Find learning resources</button><div id="links"></div><p class="muted">These are search links, not AI-verified resource recommendations.</p></div>';
$('#view').innerHTML=h}
function cards(){return courses.length?'<div class="grid">'+courses.map(c=>`<div class="card course"><span class="muted">${c.pages} PAGES · ${esc(c.status.toUpperCase())}</span><h2>${esc(c.name)}</h2><progress value="${c.progress}" max="${c.pages}"></progress><p class="muted">${c.progress} pages analyzed</p>${c.error?`<p>${esc(c.error)}</p>`:''}<div class="row"><button onclick="read('${c.id}')" ${c.status==='reading'?'disabled':''}>${c.status==='ready'?'Read again':'Read with OpenAI'}</button><button class="secondary" onclick="selected='${c.id}';go('Learning')">Open</button><button class="secondary" onclick="removeCourse('${c.id}')">Delete</button></div></div>`).join('')+'</div>':'<div class="card empty">Your bookshelf is ready for its first course.</div>'}
async function upload(btn){run(async()=>{let f=$('#file').files[0];if(!f||!$('#name').value.trim())throw Error('Choose a PDF and enter a course name.');if(f.size>20e6)throw Error('Use a PDF under 20 MB.');btn.disabled=true;try{let bytes=new Uint8Array(await f.arrayBuffer()),s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));let c=await api('upload',{name:$('#name').value,file:btoa(s)});selected=c.id;await refresh();notice('PDF saved. Click Read with OpenAI to analyze text and page images.')}finally{btn.disabled=false}})}
function read(id){run(async()=>{await api('read',{id});await refresh();notice('Reading started. Five pages per request; large books may take several minutes and incur API charges.')})}
function removeCourse(id){if(confirm('Delete this course, PDF, plan and quiz history?'))run(async()=>{await api('delete',{id});selected='';await refresh()})}
function addDate(){let v=$('#date').value;if(v)$('#dates').value=[...new Set(($('#dates').value+'\n'+v).trim().split('\n'))].sort().join('\n')}
function savePlan(){run(async()=>{const dates=$('#dates').value.trim().split(/\s+/);if(!dates.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d))||!$('#scope').value.trim())throw Error('Enter a topic and valid study dates.');await api('plan',{id:selected,dates,topic:$('#scope').value});await refresh()})}
function complete(index){run(async()=>{await api('done',{id:selected,index});await refresh()})}
function lesson(btn){run(async()=>{btn.disabled=true;$('#lesson').textContent='Preparing your lesson…';try{const r=await api('lesson',{id:selected,topic:$('#topic').value});$('#lesson').innerHTML='<pre>'+esc(r.text)+'</pre>'}finally{btn.disabled=false}})}
function startQuiz(btn){run(async()=>{btn.disabled=true;try{quiz=await api('quiz',{id:selected,topic:$('#topic').value,count:+$('#count').value,minutes:+$('#minutes').value,format:$('#format').value,kind:tab==='Quick Quiz'?'quick':'main'});quiz.id=selected;showQuiz()}finally{btn.disabled=false}})}
function showQuiz(){$('#quiz').innerHTML='<div class="card"><div class="timer" id="timer"></div>'+quiz.questions.map((q,i)=>`<div class="q"><h3>${i+1}. ${esc(q.question)}</h3>${q.type==='mcq'?q.options.map(o=>`<label><input type="radio" name="q${i}" value="${esc(o)}">${esc(o)}</label>`).join(''):`<textarea name="q${i}" placeholder="Write your reasoning"></textarea>`}</div>`).join('')+'<br><button onclick="submitQuiz()">Submit answers</button></div>';clearInterval(clock);clock=setInterval(()=>{let s=Math.max(0,Math.floor(quiz.deadline-Date.now()/1000));if($('#timer'))$('#timer').textContent=`Time remaining: ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(!s)submitQuiz()},1000)}
function submitQuiz(){clearInterval(clock);run(async()=>{let answers={};quiz.questions.forEach((q,i)=>answers[i]=(document.querySelector(q.type==='mcq'?`[name=q${i}]:checked`:`[name=q${i}]`)||{}).value||'');let r=await api('submit',{id:quiz.id,token:quiz.token,answers});$('#quiz').innerHTML='<div class="card"><h2>Your review</h2><p>'+r.score+' / '+r.mcqs+' MCQs correct</p>'+r.results.map(q=>`<div class="q"><h3>${esc(q.question)}</h3><p>Your answer: ${esc(q.response)}</p><p><b>Model answer:</b> ${esc(q.answer)}</p><p>${esc(q.explanation)}</p></div>`).join('')+'</div>';await refresh(false)})}
function resources(){let q=encodeURIComponent($('#search').value);$('#links').innerHTML=`<p><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+site%3Aedu">Search university resources ↗</a></p><p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}">Search video explanations ↗</a></p>`}
refresh();setInterval(()=>{if(courses.some(c=>c.status==='reading'))refresh(tab==='Dashboard'||tab==='My Courses')},5000);
</script></html>
